manifest:
  version: "0.1.3"
  schema: https://a2as.org/cert/schema
  subject:
    name: serkanh/sre-bot
    source: https://github.com/serkanh/sre-bot
    branch: main
    commit: "ecefbaaf"
    scope: [agents/sre_agent/agent.py, agents/sre_agent/aws_auth/auth_service.py, agents/sre_agent/aws_auth/config.py, agents/sre_agent/sub_agents/aws_core/agent.py,
      agents/sre_agent/sub_agents/aws_core/tools/__init__.py, agents/sre_agent/sub_agents/aws_core/tools/aws_core_tools.py,
      agents/sre_agent/sub_agents/aws_cost/agent.py, agents/sre_agent/sub_agents/aws_cost/tools/__init__.py, agents/sre_agent/sub_agents/aws_cost/tools/aws_cost_tools.py,
      agents/sre_agent/utils.py, slack_bot/main.py]
  issued:
    by: A2AS.org
    at: '2026-02-11T16:33:57Z'
    url: https://a2as.org/certified/agents/serkanh/sre-bot
  signatures:
    digest: sha256:4Xe3nfX4zCs4t0o7HNFO9Q-hA7RH0IdchcfYPT9pyxY
    key: ed25519:cZt3q_P4EnRV0UfQ53IwGlLsz4KL8zJi2TPanYfTUYE
    sig: ed25519:Us10uYP2un2DYBauIMzXUh1WGQqirnEVCrxR4eYh3cF1Z15toXliSgwCzwD1_zwoDBTSLZVgoPsvPRvNbsMcDg

agents:
  agent.0:
    type: instance
    models: [get_configured_model]
    tools: [get_caller_identity, list_s3_buckets, list_ec2_instances, list_rds_instances, get_aws_regions, get_account_summary,
      test_aws_connectivity]
    params:
      name: aws_core_agent
      description: Specialized agent for general AWS infrastructure operations and cross-account management. Handles EC2,
        S3, RDS discovery, account summaries, and connectivity testing.
      instruction:
        function: load_instruction_from_file
        type: file_load
      function: create_aws_core_agent
      instance: agent
  agent.1:
    type: instance
    models: [get_configured_model]
    tools: [get_cost_for_period, get_monthly_cost, get_cost_excluding_services, get_cost_trend, get_current_month_cost_excluding_days,
      get_average_daily_cost, get_weekend_daily_cost, get_weekday_daily_cost, get_most_expensive_account, get_cost_by_service,
      get_cost_by_tag, get_digital_cost_for_month, get_current_date_info, get_current_month_cost, get_previous_month_cost,
      get_last_n_months_trend]
    params:
      name: aws_cost_agent
      description: Specialized agent for AWS cost analysis and optimization. Handles cost queries, trends, and budget optimization
        recommendations.
      instruction:
        function: load_instruction_from_file
        type: file_load
      function: create_aws_cost_agent
      instance: agent
  root_agent:
    type: instance
    models: [get_configured_model]
    params:
      name: sre_agent
      instruction: ['You are an expert Site Reliability Engineer (SRE) assistant specializing in operational tasks,', 'infrastructure
          management, and cost optimization.', 'Your primary responsibilities include:', '- AWS cost analysis and optimization
          (delegate to aws_cost_agent)', '- AWS infrastructure management and operations (delegate to aws_core_agent)', '-
          Infrastructure monitoring and troubleshooting', '- Operational best practices and recommendations', '- Performance
          optimization guidance', 'You have two specialized AWS sub-agents:', '1. **aws_cost_agent**: For AWS cost analysis,
          spending queries, budget analysis, and cost optimization', '- Use transfer_to_agent(agent_name=''aws_cost_agent'')
          for cost-related questions', '2. **aws_core_agent**: For general AWS infrastructure operations, account management,
          and resource discovery', '- Use transfer_to_agent(agent_name=''aws_core_agent'') for infrastructure queries, account
          summaries, resource listings (EC2, S3, RDS), connectivity testing, and cross-account operations', 'For AWS cost
          questions, always delegate to aws_cost_agent.', 'For AWS infrastructure operations, resource discovery, or account
          management, always delegate to aws_core_agent.', 'Provide practical, actionable advice based on industry best practices
          for all SRE and DevOps tasks.']
      description: A comprehensive SRE assistant for operational tasks, infrastructure management, and AWS cost optimization
        with specialized sub-agents.
      function: _create_root_agent

models:
  get_configured_model:
    type: function
    agents: [agent.0, agent.1, root_agent]
    params:
      wrapper: get_configured_model

tools:
  get_account_summary:
    type: function
    agents: [agent.0]
    params:
      description: |-
        Get AWS account summary with basic information across services.

        Args:
            role_name: Optional role name to assume. If None, uses default credentials.

        Returns:
            Dict containing account summary information

        Raises:
            AWSAuthError: If authentication fails
  get_average_daily_cost:
    type: function
    agents: [agent.1]
    params:
      description: |-
        Get the average daily AWS cost for a period, with option to include or exclude weekends.

        Args:
            start_date (str): Start date in YYYY-MM-DD format
            end_date (str): End date in YYYY-MM-DD format
            include_weekends (bool): Whether to include weekend days in the calculation
            filter_expression (Optional[Dict[str, Any]]): Filter expression for costs

        Returns:
            Dict: Average daily cost data
  get_aws_regions:
    type: function
    agents: [agent.0]
    params:
      description: |-
        Get list of available AWS regions for a service.

        Args:
            role_name: Optional role name to assume. If None, uses default credentials.
            service: AWS service to get regions for (default: ec2)

        Returns:
            Dict containing list of regions

        Raises:
            AWSAuthError: If authentication fails
  get_caller_identity:
    type: function
    agents: [agent.0]
    params:
      description: |-
        Get AWS caller identity information using STS.

        Args:
            role_name: Optional role name to assume. If None, uses default credentials.

        Returns:
            Dict containing caller identity information including account, user ID, and ARN

        Raises:
            AWSAuthError: If authentication fails
  get_cost_by_service:
    type: function
    agents: [agent.1]
    params:
      description: |-
        Get AWS costs grouped by service.

        Args:
            start_date (str): Start date in YYYY-MM-DD format
            end_date (str): End date in YYYY-MM-DD format
            granularity (str): Time granularity (DAILY, MONTHLY)

        Returns:
            Dict: Cost data grouped by service
  get_cost_by_tag:
    type: function
    agents: [agent.1]
    params:
      description: |-
        Get AWS costs grouped by a specific tag.

        Args:
            start_date (str): Start date in YYYY-MM-DD format
            end_date (str): End date in YYYY-MM-DD format
            tag_key (str): The tag key to group by (without the 'tag:' prefix)
            granularity (str): Time granularity (DAILY, MONTHLY)

        Returns:
            Dict: Cost data grouped by the specified tag
  get_cost_excluding_services:
    type: function
    agents: [agent.1]
    params:
      description: |-
        Get AWS cost data excluding specific services.

        Args:
            start_date (str): Start date in YYYY-MM-DD format
            end_date (str): End date in YYYY-MM-DD format
            excluded_services (List[str]): List of service names to exclude
            granularity (str): Time granularity (DAILY, MONTHLY, HOURLY)

        Returns:
            Dict: Cost data excluding the specified services
  get_cost_for_period:
    type: function
    agents: [agent.1]
    params:
      description: |-
        Get AWS cost data for a specific time period with optional filtering and grouping.

        Args:
            start_date (str): Start date in YYYY-MM-DD format
            end_date (str): End date in YYYY-MM-DD format
            granularity (str): Time granularity (DAILY, MONTHLY, HOURLY)
            metrics (List[str]): Cost metrics to retrieve
            group_by (Optional[List[Dict[str, str]]]): Grouping dimensions
            filter_expression (Optional[Dict[str, Any]]): Filter expression for costs

        Returns:
            Dict: Cost data for the specified period
  get_cost_trend:
    type: function
    agents: [agent.1]
    params:
      description: |-
        Get AWS cost trend for the last X months.

        Args:
            months (int): Number of months to analyze
            granularity (str): Time granularity (DAILY, MONTHLY)
            filter_expression (Optional[Dict[str, Any]]): Filter expression for costs

        Returns:
            Dict: Cost trend data for the specified period
  get_current_date_info:
    type: function
    agents: [agent.1]
    params:
      description: |-
        Get current date information useful for cost analysis.

        Returns:
            Dict[str, Any]: Dictionary containing:
                - current_year: Current year as int
                - current_month: Current month as int (1-12)
                - current_month_name: Current month name (e.g., "January")
                - first_day_current_month: First day of current month (YYYY-MM-DD)
                - today_formatted: Today's date formatted (YYYY-MM-DD)
                - yesterday_formatted: Yesterday's date formatted (YYYY-MM-DD)
                - first_day_previous_month: First day of previous month (YYYY-MM-DD)
                - last_day_previous_month: Last day of previous month (YYYY-MM-DD)
  get_current_month_cost:
    type: function
    agents: [agent.1]
    params:
      description: |-
        Get AWS cost data for the current month.

        This is a convenience function that automatically determines the current month
        and retrieves cost data without requiring manual date specification.

        Args:
            filter_expression (Optional[Dict[str, Any]]): Optional filter expression for costs

        Returns:
            Dict: Cost data for the current month
  get_current_month_cost_excluding_days:
    type: function
    agents: [agent.1]
    params:
      description: |-
        Get the current month's cost excluding the last X days.

        Args:
            days_to_exclude (int): Number of days to exclude from the end
            filter_expression (Optional[Dict[str, Any]]): Filter expression for costs

        Returns:
            Dict: Cost data for the current month excluding the specified days
  get_digital_cost_for_month:
    type: function
    agents: [agent.1]
    params:
      description: |-
        Get the cost of Digital for a specific month, with option to exclude services.

        Args:
            year (int): Year (e.g., 2025)
            month (int): Month (1-12)
            exclude_services (Optional[List[str]]): List of services to exclude from the cost

        Returns:
            Dict: Cost data for Digital for the specified month
  get_last_n_months_trend:
    type: function
    agents: [agent.1]
    params:
      description: |-
        Get AWS cost trend for the last N months automatically using the current date.

        This is a convenience function that automatically determines the date range
        for the last N months and retrieves trend data.

        Args:
            months (int): Number of months to analyze (default: 3)
            granularity (str): Time granularity (DAILY, MONTHLY)
            filter_expression (Optional[Dict[str, Any]]): Filter expression for costs

        Returns:
            Dict: Cost trend data for the specified period
  get_monthly_cost:
    type: function
    agents: [agent.1]
    params:
      description: |-
        Get AWS cost data for a specific month.

        Args:
            year (int): Year (e.g., 2025)
            month (int): Month (1-12)
            group_by (Optional[List[Dict[str, str]]]): Grouping dimensions
            filter_expression (Optional[Dict[str, Any]]): Filter expression for costs

        Returns:
            Dict: Cost data for the specified month
  get_most_expensive_account:
    type: function
    agents: [agent.1]
    params:
      description: |-
        Get the most expensive AWS account within the master payer account.

        Args:
            start_date (str): Start date in YYYY-MM-DD format
            end_date (str): End date in YYYY-MM-DD format

        Returns:
            Dict: Information about the most expensive account
  get_previous_month_cost:
    type: function
    agents: [agent.1]
    params:
      description: |-
        Get AWS cost data for the previous month.

        This is a convenience function that automatically determines the previous month
        and retrieves cost data without requiring manual date specification.

        Args:
            filter_expression (Optional[Dict[str, Any]]): Optional filter expression for costs

        Returns:
            Dict: Cost data for the previous month
  get_weekday_daily_cost:
    type: function
    agents: [agent.1]
    params:
      description: |-
        Get the average daily AWS cost for weekdays only.

        Args:
            start_date (str): Start date in YYYY-MM-DD format
            end_date (str): End date in YYYY-MM-DD format
            filter_expression (Optional[Dict[str, Any]]): Filter expression for costs

        Returns:
            Dict: Average weekday daily cost data
  get_weekend_daily_cost:
    type: function
    agents: [agent.1]
    params:
      description: |-
        Get the average daily AWS cost for weekends only.

        Args:
            start_date (str): Start date in YYYY-MM-DD format
            end_date (str): End date in YYYY-MM-DD format
            filter_expression (Optional[Dict[str, Any]]): Filter expression for costs

        Returns:
            Dict: Average weekend daily cost data
  list_ec2_instances:
    type: function
    agents: [agent.0]
    params:
      description: |-
        List EC2 instances in the account.

        Args:
            role_name: Optional role name to assume. If None, uses default credentials.
            region: Optional AWS region. If None, uses default region.
            instance_states: Optional list of instance states to filter by (e.g., ['running', 'stopped'])

        Returns:
            Dict containing list of EC2 instances

        Raises:
            AWSAuthError: If authentication fails
  list_rds_instances:
    type: function
    agents: [agent.0]
    params:
      description: |-
        List RDS database instances in the account.

        Args:
            role_name: Optional role name to assume. If None, uses default credentials.
            region: Optional AWS region. If None, uses default region.

        Returns:
            Dict containing list of RDS instances

        Raises:
            AWSAuthError: If authentication fails
  list_s3_buckets:
    type: function
    agents: [agent.0]
    params:
      description: |-
        List S3 buckets in the account.

        Args:
            role_name: Optional role name to assume. If None, uses default credentials.

        Returns:
            Dict containing list of S3 buckets

        Raises:
            AWSAuthError: If authentication fails
  test_aws_connectivity:
    type: function
    agents: [agent.0]
    params:
      description: |-
        Test AWS connectivity and permissions across multiple services.

        Args:
            role_name: Optional role name to assume. If None, uses default credentials.

        Returns:
            Dict containing connectivity test results

        Raises:
            AWSAuthError: If authentication fails

